<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamienie Mocy</title>
    <link rel="stylesheet" href="./css/gra2.css">
</head> 
<body>
    <script>
    let liczba_gier = 0;
    let komunikat = "";
    let kolor_komunikatu = "";

    let punkty_gracza = 0, punkty_komputer = 0;
    let wybor_gracz = 0, wybor_komputer = 0;

    let nazwy_wybor = {1: "Fioletowy", 2: "Żółty", 3: "Czerwony", 4: "Zielony", 5: "Granatowy", 6: "Niebieski" };

    function aktualizuj(ktory_przycisk) {
        if (ktory_przycisk == 0) {
            liczba_gier = 0;
            punkty_gracza = 0;
            punkty_komputer = 0;
            komunikat = 'Nowa gra rozpoczęta! Powodzenia!';
            kolor_komunikatu = 'brown';
        } else {
            liczba_gier++;

            wybor_komputer = Math.floor(Math.random() * 6) + 1;
            wybor_gracz = ktory_przycisk;

            if (wybor_gracz === wybor_komputer) {
                komunikat = "Remis !";
                kolor_komunikatu = 'orange';
                punkty_gracza++;
                punkty_komputer++;
            } 
            else if (wybor_gracz > wybor_komputer) {
                komunikat = "Wygrałeś !";
                kolor_komunikatu = 'green';
                punkty_gracza++;
            } 
            else {
                komunikat = "Przegrałeś !";
                kolor_komunikatu = 'red';
                punkty_komputer++;
            }
        }

        document.getElementById("ilosc").innerHTML = liczba_gier;
        document.getElementById("komunikat").style.color = kolor_komunikatu;
        document.getElementById("komunikat").innerHTML = komunikat;
        document.getElementById("gracz").innerHTML = punkty_gracza;
        document.getElementById("komputer").innerHTML = punkty_komputer;
    }
</script>


    <a class="powrot" href="./menu.html">Powrót</a>
    <section class="tytul">
        <h1 id="komunikat">Zaczynamy nową grę. Powodzenia !</h1>
    </section>
    <section class="reszta">
        <table>
            <tr>
                <th><h1>Liczba gier</h1></th>
                <th><h1>Gracz</h1></th>
                <th><h1>Komputer</h1></th>
            </tr>
            <tr>
                <td id="ilosc">0</td>
                <td id="gracz">0</td>
                <td id="komputer">0</td>
            </tr>
        </table>
        <br>
        <section class="gra">
            <div>
                <img src="./img/niebieski.png" alt=""><br>
                <button id="6" class="niebieski" onclick="aktualizuj(6)">Wybieram niebieski</button>
            </div>
            <div>
                <img src="./img/czerwony.png" alt=""><br>
                <button id="3" class="czerwony" onclick="aktualizuj(3)">Wybieram czerwony</button>
            </div>
            <div>
                <img src="./img/granatowy.png" alt=""><br>
                <button id="5" class="granatowy" onclick="aktualizuj(5)">Wybieram granatowy</button>
            </div>
        </section>
        <section class="gra">
            <div>
                <img src="./img/żółty.png" alt=""><br>
                <button id="2" class="zolty" onclick="aktualizuj(2)">Wybieram żółty</button>
            </div>
            <div>
                <img src="./img/fioletowy.png" alt=""><br>
                <button id="1" class="fioletowy" onclick="aktualizuj(1)">Wybieram fioletowy</button>
            </div>
            <div>
                <img src="./img/zielony.png" alt=""><br>
                <button id="4" class="zielony" onclick="aktualizuj(4)">Wybieram zielony</button>
            </div>
        </section>
        <br>
        <section>
            <button class="nowa" onclick="aktualizuj(0)" id="0">Nowa gra</button>
        </section>
    </section>
</body>
</html>
